name: Analisa kripto

on:
  schedule:
    - cron: "10 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analisa-kripto
  cancel-in-progress: false

jobs:
  analisa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pasang library
        run: pip install requests pandas numpy
      - name: Jalankan analisa
        run: python kripto.py
      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset origin/main
          git add docs
          git diff --cached --quiet || git commit -m "Update kripto"
          git push origin HEAD:main
